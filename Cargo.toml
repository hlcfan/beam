[package]
name = "beam"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { path = "../gpui-component/crates/ui", features = ["tree-sitter-javascript"] }
gpui-component-assets = { path = "../gpui-component/crates/assets" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
ulid = { version = "1.2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
rust-embed = "8.8"
rquickjs = { version = "0.9", features = ["chrono"] }

[dev-dependencies]
tempfile = "3.20"
