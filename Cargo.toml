[package]
name = "beam"
version = "0.9.0"
edition = "2024"

[dependencies]
lsp-types = "0.97"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing", "macros", "local-offset"] }
dirs = "6.0"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", features = ["tree-sitter-javascript", "tree-sitter-html", "tree-sitter-graphql"], rev = "b02dc60cf898cbb755a8974984e369755d7ae3d5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
ulid = { version = "1.2", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "blocking", "json", "query", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
rust-embed = { version = "8.8", features = ["include-exclude"] }
rquickjs = { version = "0.9", default-features = false }
log = "0.4"
self_update = { version = "1.3.1", default-features = false, features = ["reqwest", "checksums", "signatures"] }
semver = "1.0"
gpui-webview = { git = "https://github.com/longbridge/gpui-kit", rev = "b02dc60cf898cbb755a8974984e369755d7ae3d5" }
wry = { version = "0.53.3", package = "lb-wry" }

[target.'cfg(target_os = "macos")'.dependencies]
# Use the system TLS implementation for requests and update downloads.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
self_update = { version = "1.3.1", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Each updater only needs its platform's release archive format.
[target.'cfg(windows)'.dependencies]
self_update = { version = "1.3.1", default-features = false, features = ["archive-zip", "compression-zip-deflate"] }

[target.'cfg(not(windows))'.dependencies]
self_update = { version = "1.3.1", default-features = false, features = ["archive-tar", "compression-tar-gz"] }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "b02dc60cf898cbb755a8974984e369755d7ae3d5", features = ["test-support"] }
tempfile = "3.20"
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-tar"] }
flate2 = "1"
tar = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# [patch."https://github.com/longbridge/gpui-kit"]
# gpui-kit = { path = "../gpui-component/crates/kit" }

[package.metadata.bundle]
name = "Beam"
identifier = "com.hlcfan.beam"
copyright = "Copyright (c) 2026 Beam"
category = "Developer Tool"
short_description = "A HTTP client for developers"
long_description = "Beam is a HTTP client."
icon = ["assets/icon.icns"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
