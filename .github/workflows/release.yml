name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Beam

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Beam
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets

  build-release:
    name: Build (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            target: aarch64-apple-darwin
            archive_name: beam-macos-aarch64.tar.gz
            artifact_name: release-macos
            package_dir: beam-macos-aarch64
            binary_name: beam
            package_kind: app
          - label: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: beam-linux-x86_64.tar.gz
            artifact_name: release-linux
            package_dir: beam-linux-x86_64
            binary_name: beam
            package_kind: binary
          - label: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive_name: beam-windows-x86_64.zip
            artifact_name: release-windows
            package_dir: beam-windows-x86_64
            binary_name: beam.exe
            package_kind: binary

    steps:
      - name: Check out Beam
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cargo-bundle
        if: matrix.package_kind == 'app'
        run: cargo install cargo-bundle --locked

      - name: Package macOS app
        if: matrix.package_kind == 'app'
        shell: bash
        run: |
          cargo bundle --release --target "${{ matrix.target }}"
          codesign --force --deep --sign - "target/${{ matrix.target }}/release/bundle/osx/${APP_NAME}.app"

          mkdir -p dist/${{ matrix.package_dir }}
          cp -R "target/${{ matrix.target }}/release/bundle/osx/${APP_NAME}.app" "dist/${{ matrix.package_dir }}/${APP_NAME}.app"
          tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.package_dir }}"
          shasum -a 256 "dist/${{ matrix.archive_name }}" > "dist/${{ matrix.archive_name }}.sha256"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.package_dir }}
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.package_dir }}/${{ matrix.binary_name }}"
          tar -C dist -czf "dist/${{ matrix.archive_name }}" "${{ matrix.package_dir }}"
          shasum -a 256 "dist/${{ matrix.archive_name }}" > "dist/${{ matrix.archive_name }}.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.package_dir }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist/${{ matrix.package_dir }}/${{ matrix.binary_name }}"
          Compress-Archive -Path "dist/${{ matrix.package_dir }}\*" -DestinationPath "dist/${{ matrix.archive_name }}" -Force
          $hash = (Get-FileHash "dist/${{ matrix.archive_name }}" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/${{ matrix.archive_name }}.sha256" -Value "$hash  ${{ matrix.archive_name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out Beam
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref_name }}" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Force-push nightly tag
        if: steps.meta.outputs.is_tip == 'true'
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          files: dist/*
          generate_release_notes: ${{ steps.meta.outputs.is_tip != 'true' }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
